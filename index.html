    // ═══════════════════════════════════════════
    //  MAP INITIALIZATION
    // ═══════════════════════════════════════════

    const map = L.map('map', {
        center: AVENCHES_CENTER,
        zoom: DEFAULT_ZOOM,
        maxZoom: 22,
        minZoom: 14,
        zoomControl: false,
        tap: true,
        tapTolerance: 15
    });

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Custom pane for grid (above tiles, below markers/overlays)
    map.createPane('gridPane');
    map.getPane('gridPane').style.zIndex = 350;
    map.getPane('gridPane').style.pointerEvents = 'none';

    // ── Tile layers ──
    const tileLayers = {
        osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22, maxNativeZoom: 19, attribution: '&copy; OSM'
        }),
        satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 22, maxNativeZoom: 19, attribution: '&copy; Esri'
        }),
        topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 22, maxNativeZoom: 17, attribution: '&copy; OpenTopoMap'
        }),
        dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 22, maxNativeZoom: 20, attribution: '&copy; CartoDB'
        }),
        transport: L.tileLayer('https://tile.thunderforest.com/transport/{z}/{x}/{y}.png?apikey=6170aad10dfd42a38d4d8c709a536f38', {
            maxZoom: 22, maxNativeZoom: 19, attribution: '&copy; Thunderforest'
        }),
        swisstopo: L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg', {
            maxZoom: 22, maxNativeZoom: 20, attribution: '&copy; Swisstopo'
        })
    };

    let currentTileLayer = tileLayers.osm;
    currentTileLayer.addTo(map);

    function switchMapLayer() {
        const layerKey = document.getElementById('map-layer').value;
        map.removeLayer(currentTileLayer);
        currentTileLayer = tileLayers[layerKey];
        currentTileLayer.addTo(map);
        // Ensure grid and elements stay on top
        if (gridLayer) gridLayer.bringToFront();
        placedElements.forEach(el => {
            if (el.layer) el.layer.bringToFront();
        });
    }

    function updateScaleInfo() {
        const center = map.getCenter();
        const zoom = map.getZoom();
        const mpp = 156543.03392 * Math.cos(center.lat * Math.PI / 180) / Math.pow(2, zoom);
        document.getElementById('scale-info').textContent = `Z${zoom} | ${mpp.toFixed(2)} m/px | Grille: ${gridSizeMeters}m`;
    }
    map.on('zoomend moveend', () => {
        updateScaleInfo();
        if (gridVisible) refreshGrid();
        refreshSelectionHandles();
    });
    updateScaleInfo();

    // ═══════════════════════════════════════════
    //  UTILITY
    // ═══════════════════════════════════════════

    function metersToLatLng(lat, meters) {
        const latOff = meters / 111320;
        const lngOff = meters / (111320 * Math.cos(lat * Math.PI / 180));
        return { lat: latOff, lng: lngOff };
    }

    function distanceBetween(ll1, ll2) { return map.distance(ll1, ll2); }

    function formatDistance(m) {
        if (m >= 1000) return (m / 1000).toFixed(2) + ' km';
        if (m >= 10) return m.toFixed(1) + ' m';
        return m.toFixed(2) + ' m';
    }

    // ═══════════════════════════════════════════
    //  SNAP GRID
    // ═══════════════════════════════════════════

    function snapToGrid(latlng) {
        if (!snapEnabled) return latlng;
        const off = metersToLatLng(latlng.lat, gridSizeMeters);
        return L.latLng(
            Math.round(latlng.lat / off.lat) * off.lat,
            Math.round(latlng.lng / off.lng) * off.lng
        );
    }

    function toggleGrid() {
        gridVisible = !gridVisible;
        document.getElementById('btn-grid').classList.toggle('active', gridVisible);
        gridVisible ? refreshGrid() : removeGrid();
    }

    function toggleSnap() {
        snapEnabled = !snapEnabled;
        document.getElementById('btn-snap').classList.toggle('active', snapEnabled);
    }

    function updateGridSize() {
        gridSizeMeters = parseFloat(document.getElementById('grid-size').value);
        updateScaleInfo();
        if (gridVisible) refreshGrid();
    }

    function updateGridAngle() {
        gridAngleDeg = parseFloat(document.getElementById('grid-angle').value);
        document.getElementById('grid-angle-label').textContent = gridAngleDeg + '°';
        if (gridVisible) refreshGrid();
    }

    function removeGrid() {
        if (gridLayer) { map.removeLayer(gridLayer); gridLayer = null; }
    }

    // Generate grid lines for a given angle, returns array of {pA, pB, major}
    // Works in screen pixel coordinates, angle in radians CCW from horizontal
    function computeGridLines(pixelSpacing, angleDeg, left, top, right, bottom) {
        const theta = angleDeg * Math.PI / 180;
        const sinT = Math.sin(theta), cosT = Math.cos(theta);
        const ext = Math.sqrt((right - left) ** 2 + (bottom - top) ** 2);
        const corners = [[left, top], [right, top], [right, bottom], [left, bottom]];
        const result = [];

        // Two sets of parallel lines, perpendicular to each other
        // Set 1: normal = (sinθ, cosθ), equation: x·sinθ + y·cosθ = c
        // Set 2: normal = (cosθ, -sinθ), equation: x·cosθ - y·sinθ = c
        for (let set = 0; set < 2; set++) {
            const nx = set === 0 ? sinT : cosT;
            const ny = set === 0 ? cosT : -sinT;
            const dx = set === 0 ? cosT : -sinT; // line direction
            const dy = set === 0 ? -sinT : -cosT;

            // Find c range from corners
            const cVals = corners.map(([x, y]) => x * nx + y * ny);
            const cMin = Math.min(...cVals) - pixelSpacing;
            const cMax = Math.max(...cVals) + pixelSpacing;
            const cStart = Math.floor(cMin / pixelSpacing) * pixelSpacing;

            const nLines = Math.ceil((cMax - cStart) / pixelSpacing) + 1;
            if (nLines > 250) continue; // safety

            let idx = 0;
            for (let c = cStart; c <= cMax; c += pixelSpacing, idx++) {
                // Point on line: (c·nx, c·ny), extend along direction ±ext
                const cx = c * nx, cy = c * ny;
                result.push({
                    ax: cx - ext * dx, ay: cy - ext * dy,
                    bx: cx + ext * dx, by: cy + ext * dy,
                    major: idx % 5 === 0
                });
            }
        }
        return result;
    }

    function refreshGrid() {
        removeGrid();
        const center = map.getCenter();
        const off = metersToLatLng(center.lat, gridSizeMeters);

        // Grid spacing in pixels
        const p1 = map.latLngToContainerPoint(center);
        const p2 = map.latLngToContainerPoint([center.lat + off.lat, center.lng]);
        const pixelSpacing = Math.abs(p1.y - p2.y);
        if (pixelSpacing < 3) { gridLayer = L.layerGroup().addTo(map); return; }

        const bounds = map.getBounds();
        const nw = map.latLngToContainerPoint(bounds.getNorthWest());
        const se = map.latLngToContainerPoint(bounds.getSouthEast());

        const gridLines = computeGridLines(pixelSpacing, gridAngleDeg, nw.x, nw.y, se.x, se.y);
        if (gridLines.length > 500) { gridLayer = L.layerGroup().addTo(map); return; }

        const lines = [];
        const style = { color: 'rgba(231, 76, 60, 0.35)', weight: 1, interactive: false, pane: 'gridPane' };
        const styleMajor = { color: 'rgba(231, 76, 60, 0.6)', weight: 1.5, interactive: false, pane: 'gridPane' };

        for (const gl of gridLines) {
            const llA = map.containerPointToLatLng([gl.ax, gl.ay]);
            const llB = map.containerPointToLatLng([gl.bx, gl.by]);
            lines.push(L.polyline([llA, llB], gl.major ? styleMajor : style));
        }

        gridLayer = L.layerGroup(lines).addTo(map);
    }

    // ═══════════════════════════════════════════
    //  MEASUREMENT TOOL
    // ═══════════════════════════════════════════

    function toggleMeasureMode() {
        measureMode = !measureMode;
        document.getElementById('btn-measure').classList.toggle('active', measureMode);
        if (measureMode) {
            document.getElementById('map').classList.add('measure-mode');
            measurePoints = [];
            updateMeasureInfo('Touchez la carte pour le 1er point.');
            document.getElementById('btn-clear-measures').style.display = '';
        } else {
            document.getElementById('map').classList.remove('measure-mode');
            if (measureTempLine) { map.removeLayer(measureTempLine); measureTempLine = null; }
            if (measureTempMarker) { map.removeLayer(measureTempMarker); measureTempMarker = null; }
            measurePoints = [];
            hideMeasureInfo();
        }
    }

    function updateMeasureInfo(t) { const el = document.getElementById('measure-info'); el.textContent = t; el.classList.add('active'); }
    function hideMeasureInfo() { document.getElementById('measure-info').classList.remove('active'); }

    function clearMeasurements() {
        measureLayers.forEach(l => map.removeLayer(l));
        measureLayers = [];
        if (measureTempLine) { map.removeLayer(measureTempLine); measureTempLine = null; }
        if (measureTempMarker) { map.removeLayer(measureTempMarker); measureTempMarker = null; }
        measurePoints = [];
        document.getElementById('btn-clear-measures').style.display = 'none';
        measureMode ? updateMeasureInfo('Touchez la carte pour le 1er point.') : hideMeasureInfo();
    }

    function addMeasurePoint(latlng) {
        measurePoints.push(latlng);
        const vi = L.divIcon({ className: 'measure-vertex', iconSize: [12, 12] });
        measureLayers.push(L.marker(latlng, { icon: vi, interactive: false }).addTo(map));

        if (measurePoints.length === 1) {
            updateMeasureInfo('Touchez pour le 2e point.');
            return;
        }
        const prev = measurePoints[measurePoints.length - 2];
        const curr = measurePoints[measurePoints.length - 1];

        measureLayers.push(L.polyline([prev, curr], {
            color: '#e74c3c', weight: 3, dashArray: '8 6', interactive: false
        }).addTo(map));

        const segDist = distanceBetween(prev, curr);
        const mid = [(prev.lat + curr.lat) / 2, (prev.lng + curr.lng) / 2];
        measureLayers.push(L.tooltip({
            permanent: true, direction: 'center', className: 'measure-label', interactive: false
        }).setLatLng(mid).setContent(formatDistance(segDist)).addTo(map));

        let total = 0;
        for (let i = 1; i < measurePoints.length; i++)
            total += distanceBetween(measurePoints[i - 1], measurePoints[i]);

        if (measurePoints.length > 2)
            updateMeasureInfo(`Seg: ${formatDistance(segDist)} | Total: ${formatDistance(total)}`);
        else
            updateMeasureInfo(`Distance: ${formatDistance(segDist)}`);
    }

    // Map events
    map.on('click', (e) => {
        if (measureMode) { L.DomEvent.stopPropagation(e); addMeasurePoint(e.latlng); return; }
        if (!placementItem) deselectAll();
    });
    map.on('contextmenu', (e) => { if (measureMode) { L.DomEvent.preventDefault(e); toggleMeasureMode(); } });
    map.on('mousemove', (e) => {
        if (!measureMode || measurePoints.length === 0) return;
        const last = measurePoints[measurePoints.length - 1];
        if (measureTempLine) map.removeLayer(measureTempLine);
        measureTempLine = L.polyline([last, e.latlng], {
            color: '#e74c3c', weight: 2, dashArray: '4 4', opacity: 0.6, interactive: false
        }).addTo(map);
        const dist = distanceBetween(last, e.latlng);
        if (measureTempMarker) map.removeLayer(measureTempMarker);
        measureTempMarker = L.tooltip({
            permanent: true, direction: 'center', className: 'measure-label', interactive: false
        }).setLatLng([(last.lat + e.latlng.lat) / 2, (last.lng + e.latlng.lng) / 2])
          .setContent(formatDistance(dist)).addTo(map);
    });

    // ═══════════════════════════════════════════
    //  BUILD LIBRARY UI
    // ═══════════════════════════════════════════

    function buildLibraryUI() {
        const container = document.getElementById('panel-library');
        container.innerHTML = '';

        for (const [catKey, cat] of Object.entries(elementLibrary)) {
            const section = document.createElement('div');
            section.className = 'library-category';
            section.innerHTML = `<h3>${cat.label}</h3>`;
            const grid = document.createElement('div');
            grid.className = 'library-grid';

            cat.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'library-item';
                div.draggable = true;
                div.innerHTML = `
                    <span class="icon">${item.icon}</span>
                    <span class="label">${item.name}</span>
                    <span class="dims">${item.width}m × ${item.height}m</span>
                `;

                // Desktop drag
                div.addEventListener('dragstart', (e) => {
                    dragSourceItem = item;
                    e.dataTransfer.setData('text/plain', JSON.stringify(item));
                    const ghost = document.getElementById('drag-ghost');
                    ghost.textContent = item.icon;
                    ghost.style.display = 'block';
                    e.dataTransfer.setDragImage(ghost, 20, 20);
                });
                div.addEventListener('dragend', () => {
                    dragSourceItem = null;
                    document.getElementById('drag-ghost').style.display = 'none';
                });

                // Click-to-place (both mobile & desktop)
                div.addEventListener('click', (e) => {
                    if (e.target.closest('.library-item')) {
                        startPlacementMode(item);
                        if (isMobile()) closeSidebar();
                    }
                });

                // Touch drag from library to map
                div.addEventListener('touchstart', (e) => {
                    touchDragItem = item;
                    const touch = e.touches[0];
                    // Create ghost
                    touchGhost = document.createElement('div');
                    touchGhost.className = 'drag-ghost';
                    touchGhost.textContent = item.icon;
                    touchGhost.style.display = 'block';
                    touchGhost.style.left = touch.clientX + 'px';
                    touchGhost.style.top = touch.clientY + 'px';
                    document.body.appendChild(touchGhost);
                }, { passive: true });

                div.addEventListener('touchmove', (e) => {
                    if (!touchGhost) return;
                    const touch = e.touches[0];
                    touchGhost.style.left = touch.clientX + 'px';
                    touchGhost.style.top = touch.clientY + 'px';
                    e.preventDefault();
                }, { passive: false });

                div.addEventListener('touchend', (e) => {
                    if (!touchDragItem || !touchGhost) {
                        touchDragItem = null;
                        return;
                    }
                    const touch = e.changedTouches[0];
                    const mapRect = document.getElementById('map').getBoundingClientRect();

                    // Check if drop is on the map
                    if (touch.clientX >= mapRect.left && touch.clientX <= mapRect.right &&
                        touch.clientY >= mapRect.top && touch.clientY <= mapRect.bottom) {
                        const x = touch.clientX - mapRect.left;
                        const y = touch.clientY - mapRect.top;
                        let latlng = map.containerPointToLatLng([x, y]);
                        if (snapEnabled) latlng = snapToGrid(latlng);
                        placeElement(touchDragItem, latlng);
                        if (isMobile()) closeSidebar();
                    }

                    touchGhost.remove();
                    touchGhost = null;
                    touchDragItem = null;
                });

                grid.appendChild(div);
            });

            section.appendChild(grid);
            container.appendChild(section);
        }
    }

    // ═══════════════════════════════════════════
    //  PLACEMENT MODE
    // ═══════════════════════════════════════════

    function startPlacementMode(item) {
        placementItem = item;
        document.getElementById('map').classList.add('placement-mode');
        if (isMobile()) {
            updateMeasureInfo(`Touchez la carte pour placer: ${item.icon} ${item.name}`);
        }
        map.once('click', (e) => {
            if (measureMode) return;
            const pos = snapEnabled ? snapToGrid(e.latlng) : e.latlng;
            placeElement(item, pos);
            document.getElementById('map').classList.remove('placement-mode');
            placementItem = null;
            hideMeasureInfo();
        });
    }

    // Desktop drag & drop on map
    const mapEl = document.getElementById('map');
    mapEl.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    mapEl.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragSourceItem) return;
        const rect = mapEl.getBoundingClientRect();
        let latlng = map.containerPointToLatLng([e.clientX - rect.left, e.clientY - rect.top]);
        if (snapEnabled) latlng = snapToGrid(latlng);
        placeElement(dragSourceItem, latlng);
        dragSourceItem = null;
    });

    // ═══════════════════════════════════════════
    //  PLACE ELEMENT
    // ═══════════════════════════════════════════

    function placeElement(item, latlng, restoreData) {
        const id = restoreData ? restoreData.id : nextId++;
        if (!restoreData && id >= nextId) nextId = id + 1;

        const data = {
            id, typeId: item.id,
            name: restoreData ? restoreData.name : item.name,
            icon: item.icon,
            width: restoreData ? restoreData.width : item.width,
            height: restoreData ? restoreData.height : item.height,
            color: restoreData ? restoreData.color : item.color,
            opacity: restoreData ? (restoreData.opacity || 0.6) : 0.6,
            rotation: restoreData ? (restoreData.rotation || 0) : 0,
            lat: latlng.lat, lng: latlng.lng,
            notes: restoreData ? (restoreData.notes || '') : '',
            layer: null, labelMarker: null
        };

        createMapElement(data);
        placedElements.push(data);
        if (!restoreData) saveUndo();
        refreshElementsList();
        selectElement(data.id);
    }

    function createMapElement(data) {
        if (data.layer) map.removeLayer(data.layer);
        if (data.labelMarker) map.removeLayer(data.labelMarker);

        const bounds = getElementBounds(data);
        const rect = L.rectangle(bounds, {
            color: data.color, fillColor: data.color,
            fillOpacity: data.opacity, weight: 2
        });

        rect.on('add', () => applyRotation(data));
        rect.addTo(map);

        rect.bindTooltip(
            `${data.icon} ${data.name}<br>${data.width}m × ${data.height}m`,
            { className: 'element-tooltip', direction: 'top', offset: [0, -10] }
        );

        // ── Mouse drag ──
        let isDragging = false;
        let dragStart = null;

        rect.on('mousedown', (e) => {
            if (measureMode || e.originalEvent.button !== 0) return;
            isDragging = true;
            dragStart = e.latlng;
            map.dragging.disable();
            L.DomEvent.stopPropagation(e);
            selectElement(data.id);
        });

        map.on('mousemove', (e) => {
            if (!isDragging || !dragStart) return;
            data.lat += e.latlng.lat - dragStart.lat;
            data.lng += e.latlng.lng - dragStart.lng;
            dragStart = e.latlng;
            updateElementVisual(data);
            updatePropsPanel();
        });

        map.on('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                dragStart = null;
                map.dragging.enable();
                if (snapEnabled) {
                    const s = snapToGrid(L.latLng(data.lat, data.lng));
                    data.lat = s.lat; data.lng = s.lng;
                    updateElementVisual(data); updatePropsPanel();
                }
                saveUndo();
            }
        });

        // ── Touch drag on map element ──
        let touchDragging = false;
        let touchStart = null;
        let longPressTimer = null;

        rect.on('click', (e) => {
            if (measureMode) return;
            L.DomEvent.stopPropagation(e);
            selectElement(data.id);
            if (isMobile()) {
                switchTab('properties');
                openSidebar();
                document.querySelectorAll('.bottom-bar-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.bottom-bar-btn[data-bb="properties"]').classList.add('active');
            }
        });

        // Touch events for dragging placed elements
        if (rect._path) attachTouchDrag(rect._path, data);
        rect.on('add', () => {
            if (rect._path) attachTouchDrag(rect._path, data);
        });

        data.layer = rect;

        // Label
        const labelIcon = L.divIcon({
            className: 'element-label',
            html: `<div style="font-size:22px;text-align:center;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,0.8);pointer-events:none;transform:rotate(${data.rotation}deg)">${data.icon}</div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });
        data.labelMarker = L.marker([data.lat, data.lng], { icon: labelIcon, interactive: false }).addTo(map);
    }

    function attachTouchDrag(pathEl, data) {
        if (pathEl._touchDragAttached) return;
        pathEl._touchDragAttached = true;

        let touchActive = false;
        let lastTouch = null;

        pathEl.addEventListener('touchstart', (e) => {
            if (measureMode) return;
            if (e.touches.length !== 1) return;
            touchActive = true;
            lastTouch = e.touches[0];
            selectElement(data.id);
            map.dragging.disable();
            e.stopPropagation();
        }, { passive: true });

        pathEl.addEventListener('touchmove', (e) => {
            if (!touchActive || !lastTouch) return;
            const t = e.touches[0];
            const mapRect = document.getElementById('map').getBoundingClientRect();

            const prevLL = map.containerPointToLatLng([lastTouch.clientX - mapRect.left, lastTouch.clientY - mapRect.top]);
            const currLL = map.containerPointToLatLng([t.clientX - mapRect.left, t.clientY - mapRect.top]);

            data.lat += currLL.lat - prevLL.lat;
            data.lng += currLL.lng - prevLL.lng;
            lastTouch = t;
            updateElementVisual(data);
            updatePropsPanel();
            e.preventDefault();
            e.stopPropagation();
        }, { passive: false });

        pathEl.addEventListener('touchend', () => {
            if (touchActive) {
                touchActive = false;
                lastTouch = null;
                map.dragging.enable();
                if (snapEnabled) {
                    const s = snapToGrid(L.latLng(data.lat, data.lng));
                    data.lat = s.lat; data.lng = s.lng;
                    updateElementVisual(data); updatePropsPanel();
                }
                saveUndo();
            }
        }, { passive: true });
    }

    function getElementBounds(data) {
        const off = metersToLatLng(data.lat, 1);
        const hW = (data.width / 2) * off.lng;
        const hH = (data.height / 2) * off.lat;
        return [[data.lat - hH, data.lng - hW], [data.lat + hH, data.lng + hW]];
    }

    function applyRotation(data) {
        if (!data.layer || !data.layer._path) return;
        const el = data.layer._path;
        const c = map.latLngToLayerPoint(L.latLng(data.lat, data.lng));
        el.style.transformOrigin = `${c.x}px ${c.y}px`;
        el.style.transform = `rotate(${data.rotation}deg)`;
    }

    function updateElementVisual(data) {
        if (data.layer) {
            data.layer.setBounds(getElementBounds(data));
            data.layer.setStyle({
                color: selectedElementId === data.id ? '#fff' : data.color,
                fillColor: data.color, fillOpacity: data.opacity,
                weight: selectedElementId === data.id ? 3 : 2,
                dashArray: selectedElementId === data.id ? '6 3' : null
            });
            data.layer.setTooltipContent(`${data.icon} ${data.name}<br>${data.width}m × ${data.height}m`);
            setTimeout(() => applyRotation(data), 0);
        }
        if (data.labelMarker) {
            data.labelMarker.setLatLng([data.lat, data.lng]);
            data.labelMarker.setIcon(L.divIcon({
                className: 'element-label',
                html: `<div style="font-size:22px;text-align:center;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,0.8);pointer-events:none;transform:rotate(${data.rotation}deg)">${data.icon}</div>`,
                iconSize: [30, 30], iconAnchor: [15, 15]
            }));
        }
        // Refresh selection handles if this is the selected element
        if (data.id === selectedElementId) refreshSelectionHandles();
    }

    // ═══════════════════════════════════════════
    //  SELECTION HANDLES (Rotation & Move)
    // ═══════════════════════════════════════════

    function getRotationHandlePos(data) {
        const dist = Math.max(data.width, data.height) * 0.6 + 1.5;
        const angleRad = (data.rotation - 90) * Math.PI / 180;
        const off = metersToLatLng(data.lat, 1);
        return L.latLng(
            data.lat + dist * off.lat * Math.sin(-angleRad + Math.PI / 2),
            data.lng + dist * off.lng * Math.cos(-angleRad + Math.PI / 2)
        );
    }

    function showSelectionHandles(data) {
        hideSelectionHandles();

        // ── Rotation handle ──
        const handlePos = getRotationHandlePos(data);

        rotationHandleLine = L.polyline([[data.lat, data.lng], handlePos], {
            color: '#fff', weight: 1.5, dashArray: '4 4', opacity: 0.7, interactive: false
        }).addTo(map);

        const rotIcon = L.divIcon({
            className: 'rotation-handle',
            html: '&#8635;',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });
        rotationHandleMarker = L.marker(handlePos, {
            icon: rotIcon, draggable: true, zIndexOffset: 10000
        }).addTo(map);

        rotationHandleMarker.on('drag', (e) => {
            const handleLL = e.target.getLatLng();
            const centerPt = map.latLngToContainerPoint([data.lat, data.lng]);
            const handlePt = map.latLngToContainerPoint(handleLL);
            const dx = handlePt.x - centerPt.x;
            const dy = -(handlePt.y - centerPt.y);
            let angle = Math.atan2(dx, dy) * 180 / Math.PI;
            if (angle < 0) angle += 360;
            if (snapEnabled) angle = Math.round(angle / 15) * 15;
            data.rotation = Math.round(angle) % 360;
            updateElementVisual(data);
            updatePropsPanel();
            rotationHandleLine.setLatLngs([[data.lat, data.lng], handleLL]);
        });

        rotationHandleMarker.on('dragend', () => {
            const newPos = getRotationHandlePos(data);
            rotationHandleMarker.setLatLng(newPos);
            rotationHandleLine.setLatLngs([[data.lat, data.lng], newPos]);
            saveUndo();
        });

        // Touch support for rotation handle
        rotationHandleMarker.on('add', () => {
            const el = rotationHandleMarker._icon;
            if (!el) return;
            let touchActive = false;
            el.addEventListener('touchstart', (e) => {
                touchActive = true;
                map.dragging.disable();
                e.stopPropagation();
            }, { passive: true });
            el.addEventListener('touchmove', (e) => {
                if (!touchActive) return;
                const t = e.touches[0];
                const mapRect = document.getElementById('map').getBoundingClientRect();
                const handlePt = { x: t.clientX - mapRect.left, y: t.clientY - mapRect.top };
                const centerPt = map.latLngToContainerPoint([data.lat, data.lng]);
                const dx = handlePt.x - centerPt.x;
                const dy = -(handlePt.y - centerPt.y);
                let angle = Math.atan2(dx, dy) * 180 / Math.PI;
                if (angle < 0) angle += 360;
                if (snapEnabled) angle = Math.round(angle / 15) * 15;
                data.rotation = Math.round(angle) % 360;
                updateElementVisual(data);
                updatePropsPanel();
                const handleLL = map.containerPointToLatLng([handlePt.x, handlePt.y]);
                rotationHandleMarker.setLatLng(handleLL);
                rotationHandleLine.setLatLngs([[data.lat, data.lng], handleLL]);
                e.preventDefault();
                e.stopPropagation();
            }, { passive: false });
            el.addEventListener('touchend', () => {
                if (touchActive) {
                    touchActive = false;
                    map.dragging.enable();
                    const newPos = getRotationHandlePos(data);
                    rotationHandleMarker.setLatLng(newPos);
                    rotationHandleLine.setLatLngs([[data.lat, data.lng], newPos]);
                    saveUndo();
                }
            }, { passive: true });
        });

        // ── Move handle (center indicator) ──
        const moveIcon = L.divIcon({
            className: 'move-handle',
            html: '&#10019;',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        moveHandleMarker = L.marker([data.lat, data.lng], {
            icon: moveIcon, draggable: true, zIndexOffset: 9999
        }).addTo(map);

        moveHandleMarker.on('drag', (e) => {
            const newLL = e.target.getLatLng();
            data.lat = newLL.lat;
            data.lng = newLL.lng;
            updateElementVisual(data);
            updatePropsPanel();
            // Update rotation handle position
            if (rotationHandleLine) {
                const rPos = getRotationHandlePos(data);
                if (rotationHandleMarker) rotationHandleMarker.setLatLng(rPos);
                rotationHandleLine.setLatLngs([[data.lat, data.lng], rPos]);
            }
        });

        moveHandleMarker.on('dragend', () => {
            if (snapEnabled) {
                const s = snapToGrid(L.latLng(data.lat, data.lng));
                data.lat = s.lat; data.lng = s.lng;
                moveHandleMarker.setLatLng([data.lat, data.lng]);
                updateElementVisual(data);
                updatePropsPanel();
                if (rotationHandleLine) {
                    const rPos = getRotationHandlePos(data);
                    if (rotationHandleMarker) rotationHandleMarker.setLatLng(rPos);
                    rotationHandleLine.setLatLngs([[data.lat, data.lng], rPos]);
                }
            }
            saveUndo();
        });
    }

    function refreshSelectionHandles() {
        const el = placedElements.find(e => e.id === selectedElementId);
        if (!el) return;
        if (rotationHandleMarker && rotationHandleLine) {
            const rPos = getRotationHandlePos(el);
            rotationHandleMarker.setLatLng(rPos);
            rotationHandleLine.setLatLngs([[el.lat, el.lng], rPos]);
        }
        if (moveHandleMarker) {
            moveHandleMarker.setLatLng([el.lat, el.lng]);
        }
    }

    function hideSelectionHandles() {
        if (rotationHandleMarker) { map.removeLayer(rotationHandleMarker); rotationHandleMarker = null; }
        if (rotationHandleLine) { map.removeLayer(rotationHandleLine); rotationHandleLine = null; }
        if (moveHandleMarker) { map.removeLayer(moveHandleMarker); moveHandleMarker = null; }
    }

    // ═══════════════════════════════════════════
    //  SELECTION
    // ═══════════════════════════════════════════

    function selectElement(id) {
        selectedElementId = id;
        placedElements.forEach(el => updateElementVisual(el));
        updatePropsPanel();
        refreshElementsList();
        const el = placedElements.find(e => e.id === id);
        if (el) showSelectionHandles(el);
        if (!isMobile()) switchTab('properties');
    }

    function deselectAll() {
        selectedElementId = null;
        hideSelectionHandles();
        placedElements.forEach(el => updateElementVisual(el));
        updatePropsPanel();
        refreshElementsList();
    }

    // ═══════════════════════════════════════════
    //  PROPERTIES PANEL
    // ═══════════════════════════════════════════

    function updatePropsPanel() {
        const form = document.getElementById('props-form');
        const msg = document.getElementById('no-selection-msg');
        const el = placedElements.find(e => e.id === selectedElementId);
        if (!el) { form.style.display = 'none'; msg.style.display = 'block'; return; }
        form.style.display = 'block'; msg.style.display = 'none';

        document.getElementById('prop-name').value = el.name;
        document.getElementById('prop-width').value = el.width;
        document.getElementById('prop-height').value = el.height;
        document.getElementById('prop-rotation').value = el.rotation;
        document.getElementById('prop-color').value = el.color;
        document.getElementById('prop-color-text').value = el.color;
        document.getElementById('prop-opacity').value = el.opacity;
        document.getElementById('prop-notes').value = el.notes || '';
        document.getElementById('prop-lat').value = el.lat.toFixed(6);
        document.getElementById('prop-lng').value = el.lng.toFixed(6);
    }

    function updateProperty(prop, value) {
        const el = placedElements.find(e => e.id === selectedElementId);
        if (!el) return;
        if (prop === 'color') {
            document.getElementById('prop-color').value = value;
            document.getElementById('prop-color-text').value = value;
        }
        el[prop] = value;
        updateElementVisual(el);
        refreshElementsList();
        saveUndo();
    }

    // ═══════════════════════════════════════════
    //  DELETE
    // ═══════════════════════════════════════════

    function deleteSelected() { const el = placedElements.find(e => e.id === selectedElementId); if (el) deleteElement(el.id); }

    function deleteElement(id) {
        const el = placedElements.find(e => e.id === id);
        if (!el) return;
        if (el.layer) map.removeLayer(el.layer);
        if (el.labelMarker) map.removeLayer(el.labelMarker);
        placedElements = placedElements.filter(e => e.id !== id);
        if (selectedElementId === id) { selectedElementId = null; hideSelectionHandles(); updatePropsPanel(); }
        saveUndo();
        refreshElementsList();
    }

    // ═══════════════════════════════════════════
    //  ELEMENTS LIST
    // ═══════════════════════════════════════════

    function refreshElementsList() {
        const list = document.getElementById('elements-list');
        const msg = document.getElementById('no-elements-msg');
        if (placedElements.length === 0) { list.innerHTML = ''; msg.style.display = 'block'; return; }
        msg.style.display = 'none';
        list.innerHTML = placedElements.map(el => `
            <div class="element-list-item ${el.id === selectedElementId ? 'selected' : ''}" onclick="selectAndFocus(${el.id})">
                <span class="el-icon">${el.icon}</span>
                <span class="el-name">${el.name}</span>
                <span class="el-delete" onclick="event.stopPropagation(); deleteElement(${el.id})" title="Supprimer">&#10005;</span>
            </div>
        `).join('');
    }

    function selectAndFocus(id) {
        selectElement(id);
        const el = placedElements.find(e => e.id === id);
        if (el) map.panTo([el.lat, el.lng]);
        if (isMobile()) closeSidebar();
    }

    // ═══════════════════════════════════════════
    //  TABS
    // ═══════════════════════════════════════════

    function switchTab(tabName) {
        document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
        const tab = document.querySelector(`.sidebar-tab[data-tab="${tabName}"]`);
        if (tab) tab.classList.add('active');
        document.getElementById(`panel-${tabName}`).classList.add('active');
    }

    // ═══════════════════════════════════════════
    //  UNDO / REDO
    // ═══════════════════════════════════════════

    function getState() {
        return JSON.stringify(placedElements.map(el => ({
            id: el.id, typeId: el.typeId, name: el.name, icon: el.icon,
            width: el.width, height: el.height, color: el.color,
            opacity: el.opacity, rotation: el.rotation,
            lat: el.lat, lng: el.lng, notes: el.notes
        })));
    }

    let lastState = null;

    function saveUndo() {
        const state = getState();
        if (state === lastState) return;
        undoStack.push(state);
        if (undoStack.length > 50) undoStack.shift();
        redoStack = [];
        lastState = state;
    }

    function undoAction() { if (undoStack.length < 2) return; redoStack.push(undoStack.pop()); const s = undoStack[undoStack.length - 1]; restoreState(s); lastState = s; }
    function redoAction() { if (!redoStack.length) return; const s = redoStack.pop(); undoStack.push(s); restoreState(s); lastState = s; }

    function restoreState(stateStr) {
        hideSelectionHandles();
        placedElements.forEach(el => { if (el.layer) map.removeLayer(el.layer); if (el.labelMarker) map.removeLayer(el.labelMarker); });
        placedElements = []; selectedElementId = null;
        JSON.parse(stateStr).forEach(item => {
            let tpl = null;
            for (const cat of Object.values(elementLibrary)) { tpl = cat.items.find(t => t.id === item.typeId); if (tpl) break; }
            if (!tpl) tpl = { id: item.typeId, name: item.name, icon: item.icon, width: item.width, height: item.height, color: item.color };
            placeElement(tpl, L.latLng(item.lat, item.lng), item);
        });
        refreshElementsList(); updatePropsPanel();
    }

    // ═══════════════════════════════════════════
    //  EXPORT XML
    // ═══════════════════════════════════════════

    function exportXML() {
        const now = new Date().toISOString();
        let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<FestivalPlan>\n  <Meta>\n`;
        xml += `    <Name>Festival Avenches</Name>\n    <Location>Place du Casino, Avenches</Location>\n`;
        xml += `    <CenterLat>${AVENCHES_CENTER[0]}</CenterLat>\n    <CenterLng>${AVENCHES_CENTER[1]}</CenterLng>\n`;
        xml += `    <Zoom>${map.getZoom()}</Zoom>\n    <ExportDate>${now}</ExportDate>\n  </Meta>\n  <Elements>\n`;

        placedElements.forEach(el => {
            xml += `    <Element>\n`;
            xml += `      <Id>${el.id}</Id>\n      <TypeId>${el.typeId}</TypeId>\n`;
            xml += `      <Name>${escapeXml(el.name)}</Name>\n      <Icon>${el.icon}</Icon>\n`;
            xml += `      <Width>${el.width}</Width>\n      <Height>${el.height}</Height>\n`;
            xml += `      <Color>${el.color}</Color>\n      <Opacity>${el.opacity}</Opacity>\n`;
            xml += `      <Rotation>${el.rotation}</Rotation>\n`;
            xml += `      <Lat>${el.lat}</Lat>\n      <Lng>${el.lng}</Lng>\n`;
            xml += `      <Notes>${escapeXml(el.notes || '')}</Notes>\n    </Element>\n`;
        });

        xml += `  </Elements>\n  <CustomLibrary>\n`;
        for (const [catKey, cat] of Object.entries(elementLibrary)) {
            cat.items.forEach(item => {
                if (item.custom) {
                    xml += `    <CustomItem>\n      <Category>${catKey}</Category>\n`;
                    xml += `      <Id>${item.id}</Id>\n      <Name>${escapeXml(item.name)}</Name>\n`;
                    xml += `      <Icon>${item.icon}</Icon>\n      <Width>${item.width}</Width>\n`;
                    xml += `      <Height>${item.height}</Height>\n      <Color>${item.color}</Color>\n`;
                    xml += `    </CustomItem>\n`;
                }
            });
        }
        xml += `  </CustomLibrary>\n</FestivalPlan>`;

        const blob = new Blob([xml], { type: 'application/xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url;
        a.download = `festival-avenches-${new Date().toISOString().slice(0, 10)}.xml`;
        a.click(); URL.revokeObjectURL(url);
    }

    function escapeXml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
    }

    // ═══════════════════════════════════════════
    //  IMPORT XML
    // ═══════════════════════════════════════════

    function showImportModal() { document.getElementById('import-modal').classList.add('active'); document.getElementById('import-xml-content').value = ''; }
    function closeImportModal() { document.getElementById('import-modal').classList.remove('active'); }

    function loadXMLFile(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { document.getElementById('import-xml-content').value = e.target.result; };
        reader.readAsText(file);
    }

    function importXML() {
        const xmlStr = document.getElementById('import-xml-content').value.trim();
        if (!xmlStr) return alert('Veuillez coller ou charger du XML.');
        try {
            const parser = new DOMParser();
            const doc = parser.parseFromString(xmlStr, 'application/xml');
            if (doc.querySelector('parsererror')) throw new Error('XML invalide');

            placedElements.forEach(el => { if (el.layer) map.removeLayer(el.layer); if (el.labelMarker) map.removeLayer(el.labelMarker); });
            placedElements = []; selectedElementId = null; nextId = 1;

            doc.querySelectorAll('CustomLibrary > CustomItem').forEach(ci => {
                const catKey = ci.querySelector('Category')?.textContent || 'divers';
                const item = {
                    id: ci.querySelector('Id')?.textContent || `custom_${Date.now()}`,
                    name: ci.querySelector('Name')?.textContent || 'Custom',
                    icon: ci.querySelector('Icon')?.textContent || '📦',
                    width: parseFloat(ci.querySelector('Width')?.textContent || 3),
                    height: parseFloat(ci.querySelector('Height')?.textContent || 3),
                    color: ci.querySelector('Color')?.textContent || '#3498db',
                    custom: true
                };
                if (elementLibrary[catKey] && !elementLibrary[catKey].items.find(i => i.id === item.id))
                    elementLibrary[catKey].items.push(item);
            });
            buildLibraryUI();

            doc.querySelectorAll('Elements > Element').forEach(elem => {
                const id = parseInt(elem.querySelector('Id')?.textContent || 0);
                const typeId = elem.querySelector('TypeId')?.textContent || '';
                const name = elem.querySelector('Name')?.textContent || 'Sans nom';
                const icon = elem.querySelector('Icon')?.textContent || '📦';
                const width = parseFloat(elem.querySelector('Width')?.textContent || 3);
                const height = parseFloat(elem.querySelector('Height')?.textContent || 3);
                const color = elem.querySelector('Color')?.textContent || '#3498db';
                const opacity = parseFloat(elem.querySelector('Opacity')?.textContent || 0.6);
                const rotation = parseFloat(elem.querySelector('Rotation')?.textContent || 0);
                const lat = parseFloat(elem.querySelector('Lat')?.textContent || AVENCHES_CENTER[0]);
                const lng = parseFloat(elem.querySelector('Lng')?.textContent || AVENCHES_CENTER[1]);
                const notes = elem.querySelector('Notes')?.textContent || '';

                placeElement({ id: typeId, name, icon, width, height, color }, L.latLng(lat, lng),
                    { id, typeId, name, icon, width, height, color, opacity, rotation, notes });
                if (id >= nextId) nextId = id + 1;
            });

            const z = doc.querySelector('Meta > Zoom');
            const cLat = doc.querySelector('Meta > CenterLat');
            const cLng = doc.querySelector('Meta > CenterLng');
            if (z && cLat && cLng) map.setView([parseFloat(cLat.textContent), parseFloat(cLng.textContent)], parseInt(z.textContent));

            undoStack = [getState()]; lastState = undoStack[0];
            closeImportModal(); refreshElementsList();
        } catch (err) { alert('Erreur import: ' + err.message); }
    }

    // ═══════════════════════════════════════════
    //  CUSTOM ELEMENT
    // ═══════════════════════════════════════════

    function showCustomElementModal() {
        document.getElementById('custom-element-modal').classList.add('active');
        document.getElementById('custom-name').value = '';
        document.getElementById('custom-icon').value = '';
        document.getElementById('custom-width').value = 3;
        document.getElementById('custom-height').value = 3;
        document.getElementById('custom-color').value = '#3498db';
    }
    function closeCustomElementModal() { document.getElementById('custom-element-modal').classList.remove('active'); }

    function addCustomElement() {
        const name = document.getElementById('custom-name').value.trim();
        const icon = document.getElementById('custom-icon').value.trim() || '📦';
        const width = parseFloat(document.getElementById('custom-width').value) || 3;
        const height = parseFloat(document.getElementById('custom-height').value) || 3;
        const color = document.getElementById('custom-color').value;
        const category = document.getElementById('custom-category').value;
        if (!name) return alert('Veuillez entrer un nom.');
        if (elementLibrary[category])
            elementLibrary[category].items.push({ id: `custom_${Date.now()}`, name, icon, width, height, color, custom: true });
        buildLibraryUI();
        closeCustomElementModal();
    }

    // ═══════════════════════════════════════════
    //  PDF EXPORT
    // ═══════════════════════════════════════════

    // Clip a line segment to a rectangle, returns null if fully outside
    function clipLineToRect(x1, y1, x2, y2, xmin, ymin, xmax, ymax) {
        // Cohen-Sutherland simplified for our use case
        function code(x, y) {
            let c = 0;
            if (x < xmin) c |= 1; else if (x > xmax) c |= 2;
            if (y < ymin) c |= 4; else if (y > ymax) c |= 8;
            return c;
        }
        let c1 = code(x1, y1), c2 = code(x2, y2);
        for (let i = 0; i < 10; i++) {
            if (!(c1 | c2)) return [x1, y1, x2, y2];
            if (c1 & c2) return null;
            const c = c1 || c2;
            let x, y;
            if (c & 8) { x = x1 + (x2 - x1) * (ymax - y1) / (y2 - y1); y = ymax; }
            else if (c & 4) { x = x1 + (x2 - x1) * (ymin - y1) / (y2 - y1); y = ymin; }
            else if (c & 2) { y = y1 + (y2 - y1) * (xmax - x1) / (x2 - x1); x = xmax; }
            else { y = y1 + (y2 - y1) * (xmin - x1) / (x2 - x1); x = xmin; }
            if (c === c1) { x1 = x; y1 = y; c1 = code(x, y); }
            else { x2 = x; y2 = y; c2 = code(x, y); }
        }
        return null;
    }

    function drawGridOnPdf(pdf, iX, mapY, iW, iH) {
        const center = map.getCenter();
        const off = metersToLatLng(center.lat, gridSizeMeters);
        const p1 = map.latLngToContainerPoint(center);
        const p2 = map.latLngToContainerPoint([center.lat + off.lat, center.lng]);
        const pixelSpacing = Math.abs(p1.y - p2.y);
        if (pixelSpacing < 2) return;

        // Map pixel bounds
        const bounds = map.getBounds();
        const nw = map.latLngToContainerPoint(bounds.getNorthWest());
        const se = map.latLngToContainerPoint(bounds.getSouthEast());
        const mapPxW = se.x - nw.x, mapPxH = se.y - nw.y;

        // Compute grid in pixel space using shared function
        const gridLines = computeGridLines(pixelSpacing, gridAngleDeg, nw.x, nw.y, se.x, se.y);

        // Convert pixel coords to PDF mm and draw
        for (const gl of gridLines) {
            const pa = [iX + ((gl.ax - nw.x) / mapPxW) * iW, mapY + ((gl.ay - nw.y) / mapPxH) * iH];
            const pb = [iX + ((gl.bx - nw.x) / mapPxW) * iW, mapY + ((gl.by - nw.y) / mapPxH) * iH];
            const seg = clipLineToRect(pa[0], pa[1], pb[0], pb[1], iX, mapY, iX + iW, mapY + iH);
            if (!seg) continue;
            pdf.setDrawColor(gl.major ? 200 : 230, gl.major ? 60 : 140, gl.major ? 50 : 130);
            pdf.setLineWidth(gl.major ? 0.3 : 0.12);
            pdf.line(seg[0], seg[1], seg[2], seg[3]);
        }
    }

    function exportPDF() { document.getElementById('pdf-modal').classList.add('active'); }
    function closePdfModal() { document.getElementById('pdf-modal').classList.remove('active'); }

    async function loadPdfLibs() {
        // Ensure jsPDF and html2canvas are loaded, try fallback CDNs if needed
        if (typeof html2canvas === 'undefined') {
            await loadScript('https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js');
        }
        if (!window.jspdf) {
            await loadScript('https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js');
        }
        if (!window.jspdf) {
            await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
        }
    }

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = () => resolve(); // don't reject, try next fallback
            document.head.appendChild(s);
        });
    }

    async function generatePDF() {
        closePdfModal();
        const title = document.getElementById('pdf-title').value || 'Plan Festival';
        const format = document.getElementById('pdf-format').value;
        const orientation = document.getElementById('pdf-orientation').value;
        const includeLegend = document.getElementById('pdf-legend').checked;

        const loadingEl = document.createElement('div');
        loadingEl.className = 'pdf-generating';
        loadingEl.innerHTML = '<div class="spinner"></div> Chargement des librairies PDF...';
        document.body.appendChild(loadingEl);

        try {
            await loadPdfLibs();

            if (!window.jspdf) {
                throw new Error('Impossible de charger la librairie jsPDF. Vérifiez votre connexion internet.');
            }
            if (typeof html2canvas === 'undefined') {
                throw new Error('Impossible de charger html2canvas. Vérifiez votre connexion internet.');
            }

            loadingEl.innerHTML = '<div class="spinner"></div> Génération du PDF...';
            await new Promise(r => setTimeout(r, 100));
            const toolbar = document.querySelector('.map-toolbar');
            const zoomCtrl = document.querySelector('.leaflet-control-zoom');
            const gridPaneEl = map.getPane('gridPane');
            toolbar.style.display = 'none';
            if (zoomCtrl) zoomCtrl.style.display = 'none';
            // Hide grid pane during capture (we draw it vectorially on the PDF)
            const gridWasVisible = gridVisible;
            if (gridPaneEl) gridPaneEl.style.display = 'none';

            const canvas = await html2canvas(document.getElementById('map'), {
                useCORS: true, allowTaint: true, scale: 2, logging: false, backgroundColor: '#1a1a2e'
            });

            toolbar.style.display = '';
            if (zoomCtrl) zoomCtrl.style.display = '';
            if (gridPaneEl) gridPaneEl.style.display = '';

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation, unit: 'mm', format });
            const pw = pdf.internal.pageSize.getWidth();
            const ph = pdf.internal.pageSize.getHeight();
            const m = 10;

            pdf.setFillColor(22, 33, 62); pdf.rect(0, 0, pw, 18, 'F');
            pdf.setTextColor(255, 255, 255); pdf.setFontSize(14); pdf.setFont(undefined, 'bold');
            pdf.text(title, m, 12);
            pdf.setFontSize(9); pdf.setFont(undefined, 'normal');
            const ds = new Date().toLocaleDateString('fr-CH', { day: '2-digit', month: 'long', year: 'numeric' });
            pdf.text(`Place du Casino, Avenches | ${ds}`, pw - m, 12, { align: 'right' });

            const mapY = 22;
            const lH = includeLegend ? 40 : 0;
            const aH = ph - mapY - m - lH;
            const aW = pw - m * 2;
            const ratio = canvas.width / canvas.height;
            let iW = aW, iH = iW / ratio;
            if (iH > aH) { iH = aH; iW = iH * ratio; }
            const iX = m + (aW - iW) / 2;

            pdf.setDrawColor(42, 42, 74); pdf.setLineWidth(0.5); pdf.rect(iX, mapY, iW, iH, 'S');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', iX, mapY, iW, iH);

            // ── Draw grid vectorially on PDF ──
            if (gridWasVisible) {
                drawGridOnPdf(pdf, iX, mapY, iW, iH);
            }

            const ctr = map.getCenter(); const z = map.getZoom();
            const mpp = 156543.03392 * Math.cos(ctr.lat * Math.PI / 180) / Math.pow(2, z);
            pdf.setFontSize(7); pdf.setTextColor(200, 200, 200);
            pdf.text(`Zoom: ${z} | ~${mpp.toFixed(2)} m/px`, iX + iW - 2, mapY + iH - 2, { align: 'right' });

            if (includeLegend && placedElements.length > 0) {
                const ly = mapY + iH + 6;
                pdf.setFillColor(22, 33, 62); pdf.rect(m, ly - 2, pw - m * 2, lH, 'F');
                pdf.setTextColor(255, 255, 255); pdf.setFontSize(10); pdf.setFont(undefined, 'bold');
                pdf.text('Légende', m + 4, ly + 5);
                pdf.setFontSize(7); pdf.setFont(undefined, 'normal');
                const cols = 4; const cW = (pw - m * 2 - 8) / cols;
                let col = 0, row = 0;
                const seen = new Set(); const items = [];
                placedElements.forEach(el => {
                    const k = el.typeId + '_' + el.name;
                    if (!seen.has(k)) { seen.add(k); items.push({ ...el, count: placedElements.filter(e => e.typeId === el.typeId && e.name === el.name).length }); }
                });
                items.forEach(it => {
                    const x = m + 4 + col * cW, y = ly + 12 + row * 6;
                    const hex = it.color;
                    pdf.setFillColor(parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16));
                    pdf.circle(x + 2, y - 1, 1.5, 'F');
                    pdf.setTextColor(224, 224, 224);
                    pdf.text(`${it.name} (${it.width}x${it.height}m)${it.count > 1 ? ' x' + it.count : ''}`, x + 6, y);
                    col++; if (col >= cols) { col = 0; row++; }
                });
            }

            pdf.setFontSize(6); pdf.setTextColor(120, 120, 140);
            pdf.text('AoA - Festival Layout Planner', m, ph - 4);
            pdf.text(ds, pw - m, ph - 4, { align: 'right' });
            pdf.save(`${title.replace(/\s+/g, '-').toLowerCase()}-${new Date().toISOString().slice(0, 10)}.pdf`);
        } catch (err) { console.error(err); alert('Erreur PDF: ' + err.message); }
        finally { loadingEl.remove(); }
    }

    // ═══════════════════════════════════════════
    //  KEYBOARD SHORTCUTS
    // ═══════════════════════════════════════════

    document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

        if ((e.key === 'Delete' || e.key === 'Backspace') && selectedElementId !== null) deleteSelected();
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undoAction(); }
        if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redoAction(); }

        if (e.key === 'Escape') {
            if (measureMode) { toggleMeasureMode(); return; }
            deselectAll();
            if (placementItem) { document.getElementById('map').classList.remove('placement-mode'); placementItem = null; hideMeasureInfo(); }
            if (isMobile()) closeSidebar();
        }

        if (e.key === 'g' || e.key === 'G') toggleGrid();
        if (e.key === 's' || e.key === 'S') toggleSnap();
        if (e.key === 'm' || e.key === 'M') toggleMeasureMode();

        if (selectedElementId !== null) {
            const el = placedElements.find(x => x.id === selectedElementId);
            if (!el) return;
            if (e.key === 'r' || e.key === 'R') {
                el.rotation = (el.rotation + (e.shiftKey ? 1 : 15)) % 360;
                updateElementVisual(el); updatePropsPanel(); saveUndo();
            }
            const nudge = e.shiftKey ? 0.5 : 0.1;
            const off = metersToLatLng(el.lat, nudge);
            let moved = false;
            if (e.key === 'ArrowUp') { e.preventDefault(); el.lat += off.lat; moved = true; }
            if (e.key === 'ArrowDown') { e.preventDefault(); el.lat -= off.lat; moved = true; }
            if (e.key === 'ArrowLeft') { e.preventDefault(); el.lng -= off.lng; moved = true; }
            if (e.key === 'ArrowRight') { e.preventDefault(); el.lng += off.lng; moved = true; }
            if (moved) {
                if (snapEnabled) { const s = snapToGrid(L.latLng(el.lat, el.lng)); el.lat = s.lat; el.lng = s.lng; }
                updateElementVisual(el); updatePropsPanel(); saveUndo();
            }
        }
    });

    // ═══════════════════════════════════════════
    //  WINDOW RESIZE
    // ═══════════════════════════════════════════

    window.addEventListener('resize', () => {
        map.invalidateSize();
        if (!isMobile()) {
            closeSidebar();
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-backdrop').classList.remove('visible');
        }
    });

    // ═══════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════

    buildLibraryUI();
    saveUndo();

    // On mobile, start with map visible
    if (isMobile()) {
        closeSidebar();
        map.invalidateSize();
    }
